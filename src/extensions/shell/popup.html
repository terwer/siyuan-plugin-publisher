<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思源笔记发布工具 · V2 POC</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 780px;
        min-height: 460px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: #1f2329;
        background: #ffffff;
      }

      .syp-ext-shell {
        display: flex;
        flex-direction: column;
        min-height: 460px;
      }

      .syp-ext-shell__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid #e5e7eb;
        background: #fafbfc;
      }

      .syp-ext-shell__title {
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #646a73;
      }

      .syp-ext-shell__toggle {
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid #d0d3d6;
        background: #ffffff;
        color: #1f2329;
        font-size: 12px;
        cursor: pointer;
      }

      .syp-ext-shell__toggle:hover {
        color: #1677ff;
        border-color: #1677ff;
      }

      .syp-ext-shell__panes {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 10px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="syp-ext-shell" class="syp-ext-shell">
      <div class="syp-ext-shell__bar">
        <span class="syp-ext-shell__title">思源笔记发布工具 · V2 POC</span>
        <button id="syp-ext-toggle" class="syp-ext-shell__toggle" type="button">连接配置</button>
      </div>
      <div class="syp-ext-shell__panes">
        <div id="syp-ext-connection" hidden></div>
        <div id="syp-ext-v2"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
